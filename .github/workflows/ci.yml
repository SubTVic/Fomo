# SPDX-License-Identifier: AGPL-3.0-only

name: CI

on:
  push:
    branches: [main, develop/production]
  pull_request:
    branches: [main, develop/production]

env:
  DATABASE_URL: postgresql://fomo:fomo_test@localhost:5432/fomo_test
  DIRECT_URL: postgresql://fomo:fomo_test@localhost:5432/fomo_test
  NEXTAUTH_SECRET: ci-test-secret-not-for-production
  NEXTAUTH_URL: http://localhost:3000
  APP_MODE: live

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fomo
          POSTGRES_PASSWORD: fomo_test
          POSTGRES_DB: fomo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fomo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test -- --run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Docker image
        run: docker build -t fomo:ci .
