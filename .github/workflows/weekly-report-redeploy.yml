# SPDX-License-Identifier: AGPL-3.0-only
#
# Refreshes the analytics report on the live site once a day without a code
# change: the static site regenerates /report/ only at build time, so this
# simply asks Vercel to rebuild via a Deploy Hook.
#
# Setup (one time):
#   1. Vercel → static-site project → Settings → Git → Deploy Hooks →
#      create a hook for branch "main", copy its URL.
#   2. GitHub → repo → Settings → Secrets and variables → Actions →
#      new secret VERCEL_DEPLOY_HOOK_URL with that URL.
# Without the secret, or if Vercel rejects the hook, the job fails (red X in
# the Actions tab) instead of a green run that did nothing.

name: Daily report redeploy

on:
  schedule:
    - cron: "0 4 * * *" # daily 04:00 UTC (06:00 Dresden in summer, 05:00 in winter)
  workflow_dispatch: {} # manual "refresh now" button in the Actions tab

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret VERCEL_DEPLOY_HOOK_URL is not set — no redeploy triggered. See setup notes at the top of this workflow."
            exit 1
          fi
          code=$(curl -sS -X POST "$HOOK" -o /dev/null -w "%{http_code}")
          echo "Deploy hook → HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Vercel deploy hook answered HTTP $code — check the hook URL in the secret."
            exit 1
          fi
