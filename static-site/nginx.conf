# nginx server block for the static FOMO bundle. Dropped into
# /etc/nginx/conf.d/default.conf (inside the http context).

server {
    listen 80;
    server_name _;

    # "current" is the published release. In the standalone image it is a real
    # folder; in the compose setup it is a symlink that update-data.sh switches
    # atomically between ./web/releases/<timestamp> folders → zero downtime.
    root /usr/share/nginx/html/current;
    index index.html;

    # Re-stat files quickly so an atomic symlink swap is picked up immediately.
    open_file_cache off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Security headers (mirrors the dynamic app's hardening).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets are immutable → cache hard.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Data + HTML must always reflect the latest swap → never cache.
    location ~* \.(json|html)$ {
        add_header Cache-Control "no-cache";
    }

    # trailingSlash:true emits directory/index.html; resolve clean URLs.
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    error_page 404 /404.html;
}
